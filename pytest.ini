# Bütün testler depo kökünden:  .venv\Scripts\python.exe -m pytest
# Tek klasör:                    .venv\Scripts\python.exe -m pytest kod/saha/testler
# Kod kod/ altındadır; içe aktarma yolu buradan verilir (PYTHONPATH=kod ile aynı).
# Gerçek-rapor testleri gelistirme/test/TeknikTaskDetayRaporu.xlsx'i okur (yoksa atlanır; başka dosya: BOSS_RAPOR).
[pytest]
pythonpath = kod
testpaths =
    kod/saha/testler
    kod/operasyon/testler
    kod/lisans/testler
python_files = test_*.py
addopts = -q
markers =
    gercek_saat: operasyon v2 testinde saati sabitleme (saha.ayarlar.simdi gerçek saat kalır)
