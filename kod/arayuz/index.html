<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <!-- Tarayıcı çubuğu: açık #EFF1F5, koyu #0F1319 (§7.1). Cihazda seçilen
         görünüm ortak/tema.ts ile ikisini de o renge çeker. -->
    <meta name="theme-color" content="#EFF1F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1319" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Dehanet EÇM Saha Sistemi — iş emirleri, saha ekibi, bina listesi ve ziyaret kaydı." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Saha" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/ikon/ikon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/ikon/apple-touch-icon.png" />
    <title>Saha Sistemi</title>
    <!-- Görünüm ilk boyamadan önce (satır içi betik güvenlik politikasına takılır). -->
    <script src="/tema-erken.js"></script>
    <style>
      /* İlk boyama: zemin + marka işareti (ortak/Marka.tsx ile aynı işaret).
         Gerçek arayüz yüklenince kaybolur. */
      html { background: #eff1f5; }
      body { margin: 0; }
      #acilis {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #eff1f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #101828;
      }
      #acilis .isaret {
        width: 76px;
        height: 76px;
        border-radius: 22px;
        background: #0b63e5;
        display: grid;
        place-items: center;
        color: #ffc900;
        font-size: 38px;
        font-weight: 800;
      }
      #acilis .yazi { font-size: 17px; font-weight: 600; letter-spacing: -0.2px; }
      #acilis .alt { font-size: 14px; color: #525c6b; margin-top: -10px; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']),
        html:not([data-theme='light']) #acilis { background: #0f1319; }
        html:not([data-theme='light']) #acilis { color: #eef1f6; }
        html:not([data-theme='light']) #acilis .alt { color: #aab3c1; }
      }
      html[data-theme='dark'],
      html[data-theme='dark'] #acilis { background: #0f1319; }
      html[data-theme='dark'] #acilis { color: #eef1f6; }
      html[data-theme='dark'] #acilis .alt { color: #aab3c1; }
    </style>
  </head>
  <body>
    <div id="kok"></div>
    <div id="acilis" role="status" aria-live="polite">
      <div class="isaret">S</div>
      <div class="yazi">Saha Sistemi</div>
      <div class="alt">Yükleniyor…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
